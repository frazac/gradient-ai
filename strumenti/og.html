<!doctype html>
<!-- Immagine di anteprima per i social (Open Graph, 1200×630): strumenti/build.py la fotografa con Chrome headless → assets/og/og.png;
     con ?quadrato la versione 2160×2160 (Linktree e profili) → assets/og/quadrato.png.
     Sfondo: i due toni del livello 3 nel Mix Gradient IA (da turchese a verdeacqua), schiariti, inclinati di 12°
     (il gradiente a dieci toni funziona nelle tracce, non nei pieni); al centro il pittogramma del livello 3
     (frullatore) e 3/5 in bianco, sotto getgradient.it. Nessun altro testo: la stessa immagine vale per tutte le lingue,
     e resta intera anche quando le app ritagliano l'anteprima in un quadrato. -->
<meta charset="utf-8">
<style>
  @font-face { font-family: 'Space Grotesk'; font-weight: 300 700; src: url('../assets/font/space-grotesk-latin.woff2') format('woff2'); }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { position: relative; color: #fff; font-family: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif; }
  #fondo { position: absolute; inset: 0; }
  .centro { position: absolute; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; }
  #icona { top: 70px; }
  #icona svg { width: 250px; height: 250px; display: block; }
  #grado { top: 322px; margin: 0; font-size: 120px; font-weight: 700; line-height: 1; letter-spacing: -0.01em; }
  #sito { top: 492px; margin: 0; font-size: 46px; font-weight: 500; letter-spacing: 0.03em; }
  /* quadrato 2160×2160: stesse proporzioni fra disegno, grado e indirizzo, centrate in verticale */
  .quadrato, .quadrato body { width: 2160px; height: 2160px; }
  .quadrato #icona { top: 440px; }
  .quadrato #icona svg { width: 720px; height: 720px; }
  .quadrato #grado { top: 1170px; font-size: 345px; }
  .quadrato #sito { top: 1600px; font-size: 132px; }
</style>
<div id="fondo"></div>
<div id="icona" class="centro"></div>
<p id="grado" class="centro">3/5</p>
<p id="sito" class="centro">getgradient.it</p>
<script src="../dist/gradient-ai.js"></script>
<script>
  var SCHIARITURA = 0.07;   // luminosità OKLCH aggiunta ai due toni
  if (location.search.indexOf('quadrato') > -1) document.documentElement.className = 'quadrato';
  // livello 3: da turchese (a) a verdeacqua (da), schiariti in OKLCH; 90° = da sinistra a destra, +12° di inclinazione
  var t3 = GradientAI.mix.livelli[2], chiaro = function (c) { return 'oklch(from ' + c + ' calc(l + ' + SCHIARITURA + ') c h)'; };
  document.getElementById('fondo').style.background = 'linear-gradient(102deg, ' + chiaro(t3.a) + ', ' + chiaro(t3.da) + ')';
  // dal pittogramma della libreria solo il disegno Lucide (con il suo peso ottico), senza disco né grado
  var g = GradientAI.toSvg(3, { variant: 'icon', color: '#ffffff', credit: false }).match(/<g transform[^>]*>[\s\S]*?<\/g>/)[0];
  g = g.replace(/transform="[^"]*"\s*/, '');
  document.getElementById('icona').innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">' + g + '</svg>';
</script>
